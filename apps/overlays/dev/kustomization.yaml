apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sample-api-dev
resources:
  - ../../base
labels:
  - pairs:
      app.kubernetes.io/environment: dev
    includeSelectors: false
# El pipeline de sample-api reescribe newName y newTag en cada push a main
# (commit automático). "pending-first-ci-run" solo existe hasta ese primer push.
images:
  - name: sample-api
    newName: ghcr.io/javiermolero12/sample-api
    newTag: "47b8d0da927a3406ffc4f6d9416abb6f1072c06f"
patches:
  # Strategic merge: configuración propia de dev (más log, APP_ENV=dev).
  - path: patch-env.yaml
  # JSON 6902: cambio puntual del host para que dev y prod convivan en el mismo Traefik.
  - target:
      kind: Ingress
      name: sample-api
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: sample-api-dev.localhost
